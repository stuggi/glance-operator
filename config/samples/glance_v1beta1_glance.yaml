apiVersion: glance.openstack.org/v1beta1
kind: Glance
metadata:
  name: glance
spec:
  serviceUser: glance
  customServiceConfig: |
    [DEFAULT]
    debug = true
  databaseInstance: openstack
  databaseUser: glance
  glanceAPI:
    debug:
      service: false
    preserveJobs: false
    replicas: 1
    #tls:
    #  api:
    #    disabled: false
    #    internal:
    #      secretName: cert-internal-svc
    #    public:
    #      secretName: cert-public-svc
    #  caBundleSecretName: combined-ca-bundle
  secret: osp-secret
  storageClass: ""
  storageRequest: 10G
